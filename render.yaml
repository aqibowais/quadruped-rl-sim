# Render Blueprint: a free static site. New > Blueprint, then pick this repo.
# Tests run before the build, so a failing check blocks the deploy.
services:
  - type: web
    name: quadruped-rl
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm test && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
